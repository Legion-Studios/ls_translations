name: Comment on missing translations

concurrency:
  group: uncommented_keys-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write

on:
  pull_request_target:
    branches:
      - master

jobs:
  comment:
    if: |
      contains(github.event.pull_request.labels.*.name, 'area/tools') == false &&
      contains(github.event.pull_request.labels.*.name, 'disable-workflows') == false
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the source code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2 # Checkout creates detached head, need to get commits from the pr itself
    - name: Install Python Packages
      run: |
        pip3 install wheel
        pip3 install setuptools
        pip3 install pygithub
        pip3 install pygithub3
    - name: Comment missing translations
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{  github.event.number }}
      run: git diff HEAD^1 HEAD | python tools/comment_untranslated_keys.py
